spring:
  application:
    name: rwanda-sme-platform

  profiles:
    active: dev

  jackson:
    time-zone: Africa/Kigali
    serialization:
      write-dates-as-timestamps: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Africa/Kigali

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
